<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>أبليكيشن المندوب - AMIAl EXPRESS</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;background:#0b1120;color:#fff;padding:12px;padding-bottom:90px}
.top{background:linear-gradient(135deg,#0ea5e9,#2563eb);border-radius:18px;padding:16px;text-align:center}
.top h1{margin:0;font-size:21px}
.top p{margin:5px 0 0;font-size:12px;opacity:.9}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;margin-top:12px}
label{font-size:13px;color:#cbd5e1}
input,select,textarea{width:100%;padding:12px;margin:6px 0 10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;margin-top:6px}
.btn-blue{background:#38bdf8;color:#00111f}
.btn-green{background:#22c55e;color:#002b11}
.btn-orange{background:#f59e0b;color:#2b1800}
.btn-red{background:#ef4444;color:#fff}
.btn-gray{background:#334155;color:#fff}
.btn-outline{background:transparent;color:#38bdf8;border:1px solid #38bdf8}
.order{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:12px;margin-top:10px}
.order b{font-size:16px}
.meta{color:#94a3b8;font-size:12.5px;margin:6px 0;line-height:1.8}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.badge-new{background:rgba(56,189,248,.2);color:#38bdf8;border:1px solid #38bdf8}
.badge-done{background:rgba(34,197,94,.2);color:#4ade80;border:1px solid #22c55e}
.badge-fail{background:rgba(239,68,68,.2);color:#f87171;border:1px solid #ef4444}
.badge-wait{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid #f59e0b}
.row{display:flex;gap:8px}.row .btn{flex:1}
.stats{display:flex;gap:8px;margin-top:12px}.stat{flex:1;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#94a3b8}
.tabs{display:flex;gap:8px;margin-top:12px}.tab{flex:1;padding:10px;text-align:center;border-radius:12px;background:#1e293b;border:1px solid #334155;cursor:pointer;font-size:13px;font-weight:800}
.tab.active{background:#38bdf8;color:#00111f}
.hidden{display:none}
#locBox{text-align:center;font-size:12px;line-height:1.7;background:#0f172a;border:1px solid #334155;border-radius:14px;padding:10px;margin-top:12px}
.small{font-size:11px;color:#94a3b8;text-align:center}
</style>
</head>
<body>

<div class="top">
<h1>🚀 AMIAl EXPRESS</h1>
<p>أبليكيشن المندوب - تتبع مباشر + أوردرات</p>
</div>

<div id="locBox">📍 جاري تشغيل الموقع تلقائياً...</div>

<!-- الدخول -->
<div id="loginBox" class="card">
<label>اسم المندوب</label>
<input id="repName" placeholder="مثال: مجدي"/>
<label>كود المندوب</label>
<input id="repCode" placeholder="مثال: 1004" inputmode="numeric"/>
<label>تاريخ الشيت</label>
<input id="sheetName" value="1/11/2026"/>
<button class="btn btn-blue" onclick="login()">دخول 🚀</button>
<p class="small">اكتب اسمك والكود زي ما هو في الشيت بالظبط</p>
</div>

<!-- الرئيسي -->
<div id="mainBox" class="hidden">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<b id="welcomeText">أهلاً</b><span class="badge badge-new">🟢 متصل الآن</span>
</div>
<p class="small" id="sheetLabel" style="text-align:right;margin:6px 0 0"></p>
<div class="stats">
<div class="stat"><b id="cTotal">0</b><span>إجمالي</span></div>
<div class="stat"><b id="cDone" style="color:#4ade80">0</b><span>تم</span></div>
<div class="stat"><b id="cFail" style="color:#f87171">0</b><span>فشل / ملغي</span></div>
<div class="stat"><b id="cLeft" style="color:#38bdf8">0</b><span>متبقي</span></div>
</div>
<div class="row">
<button class="btn btn-gray" onclick="loadOrders()">🔄 تحديث</button>
<button class="btn btn-red" onclick="logout()">خروج</button>
</div>
</div>

<div class="tabs">
<div class="tab active" id="tabAll" onclick="setFilter('all')">الكل</div>
<div class="tab" id="tabNew" onclick="setFilter('new')">الجديدة</div>
<div class="tab" id="tabDone" onclick="setFilter('done')">تم</div>
<div class="tab" id="tabFail" onclick="setFilter('fail')">فشل</div>
</div>

<div id="ordersList"></div>

<div class="card">
<label>ملاحظة للمشرف</label>
<textarea id="repNote" rows="2" placeholder="اكتب أي مشكلة أو ملاحظة..."></textarea>
<button class="btn btn-orange" onclick="sendNote()">📩 ابعت ملاحظة للمشرف</button>
</div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZBGcTO5EWaSKcIFf8SUPcBZ47yjYgMd11FTAw_MkGKAsEdSMUnGote_Cnts5jvY0fuQ/exec";
let allOrders = [], currentFilter = 'all';
let currentLat=null, currentLng=null, locInterval=null;

function getSheet(){ return document.getElementById('sheetName').value.trim() || localStorage.getItem('sheetName') || "1/11/2026"; }

function login(){
  let n=document.getElementById('repName').value.trim();
  let c=document.getElementById('repCode').value.trim();
  let s=getSheet();
  if(!n||!c){alert("اكتب اسمك والكود");return;}
  localStorage.setItem('repName',n); localStorage.setItem('repCode',c); localStorage.setItem('sheetName',s);
  showMain();
}
function logout(){ localStorage.removeItem('repName'); localStorage.removeItem('repCode'); location.reload(); }
function showMain(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('mainBox').classList.remove('hidden');
  document.getElementById('welcomeText').textContent = "أهلاً " + localStorage.getItem('repName');
  document.getElementById('sheetLabel').textContent = "📅 شيت: " + getSheet() + " | الكود: " + localStorage.getItem('repCode');
  loadOrders();
  autoStartLocation();
}
if(localStorage.getItem('repName')){
  document.getElementById('repName').value=localStorage.getItem('repName');
  document.getElementById('repCode').value=localStorage.getItem('repCode');
  if(localStorage.getItem('sheetName')) document.getElementById('sheetName').value=localStorage.getItem('sheetName');
  showMain();
}

// ===== الموقع التلقائي - التعديل الجديد =====
function autoStartLocation(){
  if(!navigator.geolocation){ document.getElementById('locBox').textContent="❌ موبايلك مش بيدعم الموقع"; return; }
  document.getElementById('locBox').textContent="📍 بيطلب إذن الموقع... دوس السماح";
  navigator.geolocation.getCurrentPosition((pos)=>{
    currentLat=pos.coords.latitude; currentLng=pos.coords.longitude;
    document.getElementById('locBox').innerHTML="✅ <b>الموقع شغال تلقائي</b> - بيتبعت كل 30 ثانية<br>📍 "+currentLat.toFixed(5)+" , "+currentLng.toFixed(5);
    sendLocationAuto();
    if(locInterval) clearInterval(locInterval);
    locInterval=setInterval(()=>{
      navigator.geolocation.getCurrentPosition((p)=>{
        currentLat=p.coords.latitude; currentLng=p.coords.longitude;
        document.getElementById('locBox').innerHTML="✅ <b>الموقع شغال تلقائي</b> - آخر تحديث: "+new Date().toLocaleTimeString('ar-EG')+"<br>📍 "+currentLat.toFixed(5)+" , "+currentLng.toFixed(5);
        sendLocationAuto();
      },()=>{},{enableHighAccuracy:true});
    },30000);
  },(err)=>{
    document.getElementById('locBox').innerHTML="❌ الموقع مرفوض - دوس على علامة القفل 🔒 فوق جنب اللينك<br>واختار الموقع > السماح<br>وبعدين اعمل تحديث للصفحة";
    setTimeout(autoStartLocation,10000);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
async function sendLocationAuto(){
  try{
    let n=localStorage.getItem('repName'), c=localStorage.getItem('repCode');
    if(!n||!currentLat) return;
    await fetch(WEB_APP_URL+"?action=updateLive&sheetName="+encodeURIComponent(getSheet()),{method:"POST",body:JSON.stringify({repName:n,repCode:c,lat:currentLat,lng:currentLng,consentStatus:"granted"})});
  }catch(e){}
}
window.addEventListener('load',()=>{ setTimeout(autoStartLocation,800); });

// ===== الأوردرات =====
function setFilter(f){
  currentFilter=f;
  ['tabAll','tabNew','tabDone','tabFail'].forEach(id=>document.getElementById(id).classList.remove('active'));
  if(f=='all') document.getElementById('tabAll').classList.add('active');
  if(f=='new') document.getElementById('tabNew').classList.add('active');
  if(f=='done') document.getElementById('tabDone').classList.add('active');
  if(f=='fail') document.getElementById('tabFail').classList.add('active');
  renderOrders();
}
async function loadOrders(){
  let n=localStorage.getItem('repName'); if(!n) return;
  let list=document.getElementById('ordersList');
  list.innerHTML="<div style='text-align:center;color:#94a3b8;padding:20px'>⏳ جاري تحميل الأوردرات...</div>";
  try{
    let res=await fetch(WEB_APP_URL+"?action=getRepOrders&sheetName="+encodeURIComponent(getSheet())+"&repName="+encodeURIComponent(n)+"&_t="+Date.now());
    let data=await res.json();
    allOrders=data.orders||data||[];
    renderOrders();
  }catch(e){ list.innerHTML="<div style='text-align:center;color:#f87171;padding:20px'>❌ مش قادر أحمل الأوردرات - اتأكد من النت</div>"; }
}
function renderOrders(){
  let list=document.getElementById('ordersList');
  let filtered=allOrders;
  if(currentFilter=='new') filtered=allOrders.filter(o=>!String(o.status||o.Status||'').includes('تم')&&!String(o.status||o.Status||'').includes('فشل'));
  if(currentFilter=='done') filtered=allOrders.filter(o=>String(o.status||o.Status||'').includes('تم'));
  if(currentFilter=='fail') filtered=allOrders.filter(o=>String(o.status||o.Status||'').includes('فشل')||String(o.status||o.Status||'').includes('ملغي'));
  let done=allOrders.filter(o=>String(o.status||o.Status||'').includes('تم')).length;
  let fail=allOrders.filter(o=>String(o.status||o.Status||'').includes('فشل')||String(o.status||o.Status||'').includes('ملغي')).length;
  document.getElementById('cTotal').textContent=allOrders.length;
  document.getElementById('cDone').textContent=done;
  document.getElementById('cFail').textContent=fail;
  document.getElementById('cLeft').textContent=allOrders.length-done-fail;
  if(!filtered.length){ list.innerHTML="<div style='text-align:center;color:#94a3b8;padding:20px'>مفيش أوردرات في القسم ده</div>"; return; }
  list.innerHTML="";
  filtered.forEach(o=>{
    let status=o.status||o.Status||"جديد";
    let badge=status.includes("تم")?"badge-done":(status.includes("فشل")||status.includes("ملغي")?"badge-fail":"badge-new");
    let d=document.createElement('div'); d.className='order';
    d.innerHTML=`
      <div style="display:flex;justify-content:space-between"><b>📦 ${o.orderId||o.id||''}</b><span class="badge ${badge}">${status}</span></div>
      <div class="meta">👤 ${o.customerName||o.customer||''}<br>📞 ${o.phone||o.customerPhone||''}<br>📍 ${o.address||''}<br>💰 ${o.amount||o.total||''} ج | 📝 ${o.notes||''}</div>
      <div class="row">
        <button class="btn btn-green" onclick="updateOrder('${o.orderId||o.id}','تم التوصيل')">✅ تم التوصيل</button>
        <button class="btn btn-red" onclick="updateOrder('${o.orderId||o.id}','فشل التوصيل')">❌ فشل</button>
      </div>
      <div class="row">
        <a href="tel:${o.phone||o.customerPhone||''}" style="flex:1;text-decoration:none"><button class="btn btn-blue" style="width:100%">📞 اتصل بالعميل</button></a>
        <a href="https://maps.google.com/?q=${encodeURIComponent(o.address||'')}" target="_blank" style="flex:1;text-decoration:none"><button class="btn btn-gray" style="width:100%">📍 الخريطة</button></a>
      </div>
    `;
    list.appendChild(d);
  });
}
async function updateOrder(id, st){
  if(!confirm("تأكيد: "+st+" ؟")) return;
  try{
    await fetch(WEB_APP_URL+"?action=updateOrderStatus&sheetName="+encodeURIComponent(getSheet()),{method:"POST",body:JSON.stringify({orderId:id,status:st,repName:localStorage.getItem('repName')})});
    alert("تم ✅"); loadOrders();
  }catch(e){alert("حصل خطأ، حاول تاني");}
}
async function sendNote(){
  let note=document.getElementById('repNote').value.trim();
  if(!note){alert("اكتب الملاحظة الأول");return;}
  try{
    await fetch(WEB_APP_URL+"?action=sendRepNote&sheetName="+encodeURIComponent(getSheet()),{method:"POST",body:JSON.stringify({repName:localStorage.getItem('repName'),note:note})});
    alert("تم إرسال الملاحظة ✅"); document.getElementById('repNote').value="";
  }catch(e){alert("اتحفظت، حاول تاني");}
}
</script>
</body>
</html>
