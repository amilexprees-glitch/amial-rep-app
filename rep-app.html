<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مندوب الشحن - أميال إكسبريس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-100">
            <div class="text-center mb-6">
                <div class="bg-indigo-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-indigo-600 text-2xl font-bold">2M</div>
                <h1 class="text-2xl font-bold text-slate-800">تسجيل دخول المناديب</h1>
                <p class="text-slate-500 text-sm mt-1">شركة أميال إكسبريس للشحن</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">اختر الشهر</label>
                    <select id="loginMonth" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="1/11/2026">شهر 11 - 2026</option>
                        <option value="1/10/2026">شهر 10 - 2026</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">اختر اليوم (اختياري)</label>
                    <select id="loginDay" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="all">كل أيام الشهر</option>
                        <!-- توليد أيام الشهر من 1 إلى 31 -->
                        <script>
                            for(let d=1; d<=31; d++) {
                                document.write(`<option value="${d}">${d}</option>`);
                            }
                        </script>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">اسم المندوب</label>
                    <input type="text" id="repNameInput" required placeholder="أدخل اسمك كما هو مسجل" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">الكود السري (PIN)</label>
                    <input type="password" id="repPinInput" required placeholder="****" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">دخول للنظام</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية للمندوب -->
    <div id="appScreen" class="hidden max-w-4xl mx-auto p-4 pb-20">
        <header class="bg-white rounded-2xl p-4 shadow-sm mb-4 flex justify-between items-center">
            <div>
                <h2 id="welcomeRep" class="text-lg font-bold text-slate-800">مرحباً، مندوبنا العزيز</h2>
                <p id="filterInfo" class="text-xs text-slate-500">جاري عرض الطلبات...</p>
            </div>
            <button onclick="logout()" class="text-red-500 text-sm font-semibold bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100"><i class="fa-solid fa-power-off ml-1"></i> خروج</button>
        </header>

        <!-- لوحة الملخص المالي -->
        <div class="grid grid-cols-3 gap-3 mb-4 text-center">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs text-slate-400 block">إجمالي الطلبات</span>
                <span id="totalOrders" class="text-lg font-bold text-slate-800">0</span>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs text-slate-400 block">التحصيل المطلوب</span>
                <span id="totalCollection" class="text-lg font-bold text-indigo-600">0 ج.م</span>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs text-slate-400 block">عمولتك الصافية</span>
                <span id="totalCommission" class="text-lg font-bold text-emerald-600">0 ج.م</span>
            </div>
        </div>

        <!-- قائمة الأوردرات -->
        <div id="ordersContainer" class="space-y-3">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <script>
        // ضع رابط السكريبت الخاص بك هنا بعد النشر الجديد
        const WEB_APP_URL = "ضع_رابط_نشر_السكريبت_هنا";

        let currentRep = "";
        let currentPin = "";
        let currentMonth = "";
        let currentDay = "";
        let commissionRate = 25;
        let ordersData = [];

        // تتبع الموقع جغرافياً وإرساله للنظام كل دقيقة
        function startLocationTracking(repName) {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "updateLocation",
                            rep: repName,
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        })
                    }).catch(err => console.log(err));
                }, (error) => console.log(error), { enableHighAccuracy: true });
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            currentRep = document.getElementById("repNameInput").value.trim();
            currentPin = document.getElementById("repPinInput").value.trim();
            currentMonth = document.getElementById("loginMonth").value;
            currentDay = document.getElementById("loginDay").value;

            const btn = document.getElementById("loginBtn");
            btn.innerText = "جاري التحقق...";
            btn.disabled = true;

            fetch(`${WEB_APP_URL}?rep=${encodeURIComponent(currentRep)}&pin=${encodeURIComponent(currentPin)}&month=${encodeURIComponent(currentMonth)}&day=${encodeURIComponent(currentDay)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        commissionRate = data.commission;
                        ordersData = data.orders;
                        document.getElementById("loginScreen").classList.add("hidden");
                        document.getElementById("appScreen").classList.remove("hidden");
                        document.getElementById("welcomeRep").innerText = `المندوب: ${currentRep}`;
                        document.getElementById("filterInfo").innerText = `الشهر: ${currentMonth} | اليوم: ${currentDay === 'all' ? 'الكل' : currentDay}`;
                        renderOrders();
                        startLocationTracking(currentRep);
                    } else {
                        alert(data.message || "خطأ في بيانات الدخول");
                        btn.innerText = "دخول للنظام";
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    alert("حدث خطأ في الاتصال بالخادم");
                    btn.innerText = "دخول للنظام";
                    btn.disabled = false;
                });
        }

        function renderOrders() {
            const container = document.getElementById("ordersContainer");
            container.innerHTML = "";
            let totalCol = 0;
            let deliveredCount = 0;

            if (ordersData.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400">لا توجد طلبات مسجلة في هذا النطاق</div>`;
                return;
            }

            ordersData.forEach((order, index) => {
                if (order.statusK === "تم التسليم" || order.statusK === "مستلم") {
                    totalCol += Number(order.price) || 0;
                    deliveredCount++;
                }

                // رسالة الواتساب المحدثة بالصيغة المطلوبة تماماً
                const waMessage = `مساء الخير يا فندم, شركة اميال للشحن بنتواصل مع حضرتك لتأكيد الطلب الخاص بكم: \nلتأكيد الطلب و بدء عمليه الشحن\nبرجاء الرد بكلمه تأكيد\nو ارسال العنوان تفصيلي مع علامه مميزه بالعنوان (سوبرماركت / مدرسه / قهوه / مسجد ... ) او لوكيشن موقع الاستلام , و لو في رقم اضافي لحضرتك ممكن تبعته علشان المندوب يقدر يسلم حضرتك الطلب \nشكرا لزوق حضرتك`;
                const encodedWa = encodeURIComponent(waMessage);

                const card = document.createElement("div");
                card.className = `bg-white rounded-2xl p-4 shadow-sm border ${order.isLocked ? 'border-amber-200 bg-amber-50/20' : 'border-slate-100'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">طلب #${order.rowIndex}</span>
                            <span class="text-xs text-slate-400 mr-2">${order.date || ''}</span>
                        </div>
                        <span class="font-bold text-slate-800">${order.price} ج.م</span>
                    </div>
                    <div class="mb-3">
                        <h3 class="font-bold text-slate-900 text-base">${order.clientName}</h3>
                        <div class="flex items-center gap-2 mt-1">
                            <input type="text" id="addr_${index}" value="${order.address}" ${order.isLocked ? 'disabled' : ''} class="w-full text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded px-2 py-1 outline-none focus:border-indigo-500" placeholder="تعديل العنوان محلياً...">
                            <button onclick="saveLocalAddress(${index})" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded text-slate-700 whitespace-nowrap">تحديث محلي</button>
                        </div>
                    </div>
                    
                    ${order.isLocked ? '<div class="text-xs text-amber-600 bg-amber-50 p-2 rounded mb-2 font-semibold"><i class="fa-solid fa-lock ml-1"></i> هذا الطلب مغلق بواسطة الإدارة/المحاسب ولا يمكن تعديله</div>' : ''}

                    <!-- خيارات المرتجع والوارد -->
                    <div class="grid grid-cols-2 gap-2 mb-3 bg-slate-50 p-2 rounded-xl">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">حالة الوارد (K)</label>
                            <select id="statusK_${index}" ${order.isLocked ? 'disabled' : ''} onchange="handleStatusChange(${index})" class="w-full text-xs bg-white border border-slate-200 rounded-lg p-2 outline-none">
                                <option value="" ${order.statusK === '' ? 'selected' : ''}>اختر الحالة...</option>
                                <option value="تم التسليم" ${order.statusK === 'تم التسليم' ? 'selected' : ''}>تم التسليم</option>
                                <option value="مرتجع" ${order.statusK === 'مرتجع' ? 'selected' : ''}>مرتجع</option>
                                <option value="مؤجل" ${order.statusK === 'مؤجل' ? 'selected' : ''}>مؤجل</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1">خط (N)</label>
                            <input type="text" id="lineN_${index}" value="${order.lineN}" ${order.isLocked ? 'disabled' : ''} onchange="updateOrderData(${index})" placeholder="كتابة الخط..." class="w-full text-xs bg-white border border-slate-200 rounded-lg p-2 outline-none">
                        </div>
                    </div>

                    <!-- أزرار التواصل (اتصال - واتساب - إرسال رسالة نصية) -->
                    <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                        <a href="tel:${order.phone}" class="flex-1 bg-emerald-50 text-emerald-600 text-center py-2 rounded-xl font-semibold text-xs hover:bg-emerald-100"><i class="fa-solid fa-phone ml-1"></i> اتصال</a>
                        <a href="https://wa.me/2${order.phone}?text=${encodedWa}" target="_blank" class="flex-1 bg-green-50 text-green-600 text-center py-2 rounded-xl font-semibold text-xs hover:bg-green-100"><i class="fa-brands fa-whatsapp ml-1"></i> واتساب</a>
                        <a href="sms:${order.phone}?body=${encodedWa}" class="flex-1 bg-sky-50 text-sky-600 text-center py-2 rounded-xl font-semibold text-xs hover:bg-sky-100"><i class="fa-solid fa-message ml-1"></i> SMS</a>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("totalOrders").innerText = ordersData.length;
            document.getElementById("totalCollection").innerText = totalCol + " ج.م";
            document.getElementById("totalCommission").innerText = (deliveredCount * commissionRate) + " ج.م";
        }

        // تعديل العنوان محلياً فقط دون إرساله للشيت
        function saveLocalAddress(index) {
            const newAddr = document.getElementById(`addr_${index}`).value;
            ordersData[index].address = newAddr;
            alert("✅ تم تعديل العنوان محلياً في التطبيق بنجاح!");
        }

        // عند تغيير حالة الوارد (K)، إذا كانت مرتجع يتيح له التعديل بحرية
        function handleStatusChange(index) {
            const statusK = document.getElementById(`statusK_${index}`).value;
            ordersData[index].statusK = statusK;
            updateOrderData(index);
        }

        // إرسال التحديثات للسيرفر وجوجل شيت لحظياً
        function updateOrderData(index) {
            const order = ordersData[index];
            const statusK = document.getElementById(`statusK_${index}`).value;
            const lineN = document.getElementById(`lineN_${index}`).value;

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    month: currentMonth,
                    rowIndex: order.rowIndex,
                    statusK: statusK,
                    lineN: lineN
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status !== "success") {
                    alert(data.message || "فشل التحديث");
                } else {
                    renderOrders(); // إعادة حساب الملخص المالي فوراً
                }
            })
            .catch(err => console.log(err));
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
