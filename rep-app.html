<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIAL EXPRESS - بوابة المناديب الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen">

    <!-- 1. شاشة تسجيل الدخول الداكنة المطابقة للصورة الزرقاء -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-b from-[#0b1322] to-[#131e32]">
        <div class="bg-[#1b2738]/90 backdrop-blur-md rounded-2xl shadow-2xl w-full max-w-md p-8 border border-slate-700/60">
            <div class="text-center mb-8">
                <!-- الأيقونة المتدرجة A -->
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#22d3ee] to-[#34d399] flex items-center justify-center mx-auto mb-4 shadow-lg shadow-cyan-500/20">
                    <span class="text-3xl font-extrabold text-[#0f172a]">A</span>
                </div>
                <h1 class="text-2xl font-extrabold tracking-wider text-white">AMIAL EXPRESS</h1>
                <p class="text-slate-400 text-xs mt-1.5">بوابة المناديب الذكية - سجل الدخول لعرض أوردراتك</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <input type="text" id="repNameInput" required placeholder="اسم المندوب (مثال: ماهر18)" 
                           class="w-full px-4 py-3.5 rounded-xl bg-[#111827] border border-slate-700/80 text-white placeholder-slate-400 text-center focus:ring-2 focus:ring-cyan-400 focus:border-transparent outline-none transition">
                </div>
                <div>
                    <input type="password" id="repPinInput" required placeholder="الكود السري (PIN)" 
                           class="w-full px-4 py-3.5 rounded-xl bg-[#111827] border border-slate-700/80 text-white placeholder-slate-400 text-center focus:ring-2 focus:ring-cyan-400 focus:border-transparent outline-none transition">
                </div>
                <button type="submit" id="loginBtn" 
                        class="w-full bg-gradient-to-r from-[#22d3ee] to-[#0ea5e9] text-[#0f172a] py-3.5 rounded-xl font-extrabold text-base hover:opacity-95 transition shadow-lg shadow-cyan-500/25 flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-lock text-amber-500"></i>
                    <span>دخول وعرض الأوردرات</span>
                </button>
            </form>
        </div>
    </div>

    <!-- 2. لوحة التحكم الرئيسية للمندوب (تحتوي على اختيار الشهر واليوم بالداخل) -->
    <div id="appScreen" class="hidden max-w-4xl mx-auto p-4 pb-24 bg-slate-100 text-slate-800 min-h-screen">
        <!-- الهيدر العلوي -->
        <header class="bg-[#0f172a] text-white rounded-2xl p-4 shadow-md mb-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#22d3ee] to-[#34d399] flex items-center justify-center font-extrabold text-[#0f172a] text-lg">A</div>
                <div>
                    <h2 id="welcomeRep" class="text-base font-bold text-white">مرحباً، مندوبنا العزيز</h2>
                    <p class="text-[11px] text-cyan-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> متصل الآن (تتبع نشط)
                    </p>
                </div>
            </div>
            <button onclick="logout()" class="text-red-400 text-xs font-bold bg-slate-800/80 border border-slate-700 px-3 py-2 rounded-xl hover:bg-red-500/20 transition">
                <i class="fa-solid fa-power-off ml-1"></i> خروج
            </button>
        </header>

        <!-- شريط فلترة الشهر واليوم داخل التطبيق -->
        <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 mb-4">
            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">الشهر</label>
                    <select id="appMonth" onchange="fetchOrders()" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-cyan-500 outline-none">
                        <option value="1/11/2026" selected>شهر 11 - 2026</option>
                        <option value="1/10/2026">شهر 10 - 2026</option>
                        <option value="1/12/2026">شهر 12 - 2026</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">اليوم</label>
                    <select id="appDay" onchange="fetchOrders()" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-cyan-500 outline-none">
                        <option value="all">كل أيام الشهر</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- لوحة الملخص المالي -->
        <div class="grid grid-cols-3 gap-2.5 mb-4 text-center">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200/60">
                <span class="text-[11px] text-slate-400 font-semibold block">إجمالي الطلبات</span>
                <span id="totalOrders" class="text-lg font-extrabold text-slate-800">0</span>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200/60">
                <span class="text-[11px] text-slate-400 font-semibold block">التحصيل المطلوب</span>
                <span id="totalCollection" class="text-lg font-extrabold text-sky-600">0 ج.م</span>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200/60">
                <span class="text-[11px] text-slate-400 font-semibold block">عمولتك الصافية</span>
                <span id="totalCommission" class="text-lg font-extrabold text-emerald-600">0 ج.م</span>
            </div>
        </div>

        <!-- قائمة الأوردرات -->
        <div id="ordersContainer" class="space-y-3">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <script>
        // رابط السكريبت الخاص بك مدمج وجاهز
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzYM1mrggrf1UkoLSrODb185j-d5o2yZJi5JSk0e7TWsE4WA6zhUvJiCDQUdVstHChBnA/exec";

        let currentRep = "";
        let currentPin = "";
        let commissionRate = 25;
        let ordersData = [];

        // تعبئة قائمة الأيام داخل التطبيق من 1 إلى 31
        window.addEventListener("DOMContentLoaded", () => {
            const daySelect = document.getElementById("appDay");
            for (let d = 1; d <= 31; d++) {
                const opt = document.createElement("option");
                opt.value = d;
                opt.textContent = "يوم " + d;
                daySelect.appendChild(opt);
            }
        });

        // تتبع الموقع جغرافياً وإرساله للنظام لحظياً
        function startLocationTracking(repName) {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "updateLocation",
                            rep: repName,
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        })
                    }).catch(err => console.log(err));
                }, (error) => console.log(error), { enableHighAccuracy: true });
            }
        }

        // تسجيل الدخول
        function handleLogin(e) {
            e.preventDefault();
            currentRep = document.getElementById("repNameInput").value.trim();
            currentPin = document.getElementById("repPinInput").value.trim();

            const btn = document.getElementById("loginBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري الدخول...</span>`;
            btn.disabled = true;

            fetchOrders(true);
        }

        // جلب الأوردرات حسب الشهر واليوم المختارين داخل التطبيق
        function fetchOrders(isInitialLogin = false) {
            const selectedMonth = document.getElementById("appMonth").value;
            const selectedDay = document.getElementById("appDay").value;
            const container = document.getElementById("ordersContainer");

            if (!isInitialLogin) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-500 font-bold"><i class="fa-solid fa-spinner fa-spin text-cyan-500 text-2xl mb-2 block"></i> جاري تحميل أوردرات الشهر واليوم...</div>`;
            }

            fetch(`${WEB_APP_URL}?rep=${encodeURIComponent(currentRep)}&pin=${encodeURIComponent(currentPin)}&month=${encodeURIComponent(selectedMonth)}&day=${encodeURIComponent(selectedDay)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        commissionRate = data.commission;
                        ordersData = data.orders;
                        
                        if (isInitialLogin) {
                            document.getElementById("loginScreen").classList.add("hidden");
                            document.getElementById("appScreen").classList.remove("hidden");
                            document.getElementById("welcomeRep").innerText = `المندوب: ${currentRep}`;
                            startLocationTracking(currentRep);
                        }
                        renderOrders();
                    } else {
                        if (isInitialLogin) {
                            alert(data.message || "خطأ في اسم المندوب أو الكود السري");
                            resetLoginBtn();
                        } else {
                            container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-red-500 font-bold">${data.message || "لا توجد بيانات"}</div>`;
                        }
                    }
                })
                .catch(err => {
                    alert("حدث خطأ في الاتصال بالخادم، تأكد من الإنترنت");
                    if (isInitialLogin) resetLoginBtn();
                });
        }

        function resetLoginBtn() {
            const btn = document.getElementById("loginBtn");
            btn.innerHTML = `<i class="fa-solid fa-lock text-amber-500"></i> <span>دخول وعرض الأوردرات</span>`;
            btn.disabled = false;
        }

        function renderOrders() {
            const container = document.getElementById("ordersContainer");
            container.innerHTML = "";
            let totalCol = 0;
            let deliveredCount = 0;

            if (ordersData.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 font-semibold border border-slate-200/60">لا توجد طلبات مسجلة في هذا اليوم أو الشهر</div>`;
                document.getElementById("totalOrders").innerText = "0";
                document.getElementById("totalCollection").innerText = "0 ج.م";
                document.getElementById("totalCommission").innerText = "0 ج.م";
                return;
            }

            // صيغة رسالة الواتساب المحدثة
            const waMessage = `مساء الخير يا فندم, شركة اميال للشحن بنتواصل مع حضرتك لتأكيد الطلب الخاص بكم: \nلتأكيد الطلب و بدء عمليه الشحن\nبرجاء الرد بكلمه تأكيد\nو ارسال العنوان تفصيلي مع علامه مميزه بالعنوان (سوبرماركت / مدرسه / قهوه / مسجد ... ) او لوكيشن موقع الاستلام , و لو في رقم اضافي لحضرتك ممكن تبعته علشان المندوب يقدر يسلم حضرتك الطلب \nشكرا لزوق حضرتك`;
            const encodedWa = encodeURIComponent(waMessage);

            ordersData.forEach((order, index) => {
                if (order.statusK === "تم التسليم" || order.statusK === "مستلم") {
                    totalCol += Number(order.price) || 0;
                    deliveredCount++;
                }

                const isReturnSelected = (order.statusK === "مرتجع" || (!["", "تم التسليم", "مؤجل"].includes(order.statusK)));

                const card = document.createElement("div");
                card.className = `bg-white rounded-2xl p-4 shadow-sm border ${order.isLocked ? 'border-amber-300 bg-amber-50/30' : 'border-slate-200/80'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-xs font-bold text-sky-700 bg-sky-50 px-2.5 py-0.5 rounded-lg">طلب #${order.rowIndex}</span>
                            <span class="text-xs text-slate-400 mr-2 font-semibold">${order.date || ''}</span>
                        </div>
                        <span class="font-extrabold text-slate-900 text-base">${order.price} ج.م</span>
                    </div>

                    <div class="mb-3">
                        <h3 class="font-bold text-slate-900 text-base">${order.clientName}</h3>
                        <!-- تعديل العنوان محلياً فقط -->
                        <div class="flex items-center gap-1.5 mt-1.5">
                            <input type="text" id="addr_${index}" value="${order.address}" class="w-full text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none focus:border-sky-500" placeholder="العنوان...">
                            <button onclick="saveLocalAddress(${index})" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-white font-bold whitespace-nowrap">حفظ محلي</button>
                        </div>
                    </div>
                    
                    ${order.isLocked ? '<div class="text-xs text-amber-700 bg-amber-100/80 p-2.5 rounded-xl mb-3 font-bold flex items-center gap-1.5"><i class="fa-solid fa-lock"></i> هذا الطلب مغلق بواسطة الإدارة/المحاسب ولا يمكن تعديله</div>' : ''}

                    <!-- خيارات الحالة والوارد (K) وخط (N) -->
                    <div class="grid grid-cols-2 gap-2 mb-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">حالة الطلب (K)</label>
                            <select id="statusSelect_${index}" ${order.isLocked ? 'disabled' : ''} onchange="onStatusSelectChange(${index})" class="w-full text-xs font-bold bg-white border border-slate-200 rounded-xl p-2 outline-none">
                                <option value="" ${order.statusK === '' ? 'selected' : ''}>اختر الحالة...</option>
                                <option value="تم التسليم" ${order.statusK === 'تم التسليم' ? 'selected' : ''}>تم التسليم</option>
                                <option value="مرتجع" ${isReturnSelected ? 'selected' : ''}>مرتجع (إدخال مبلغ)</option>
                                <option value="مؤجل" ${order.statusK === 'مؤجل' ? 'selected' : ''}>مؤجل</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">خط (N)</label>
                            <input type="text" id="lineN_${index}" value="${order.lineN}" ${order.isLocked ? 'disabled' : ''} onchange="updateOrderData(${index})" placeholder="كتابة الخط..." class="w-full text-xs font-bold bg-white border border-slate-200 rounded-xl p-2 outline-none">
                        </div>

                        <!-- خانة كتابة رقم/مبلغ الوارد عند اختيار مرتجع -->
                        <div id="returnBox_${index}" class="${isReturnSelected ? '' : 'hidden'} col-span-2 mt-1 pt-2 border-t border-slate-200/80">
                            <label class="block text-[11px] font-bold text-rose-600 mb-1">قيمة الوارد / المبلغ في عمود (K) للمرتجع:</label>
                            <div class="flex gap-2">
                                <input type="number" id="returnPrice_${index}" value="${isReturnSelected && order.statusK !== 'مرتجع' ? order.statusK : ''}" ${order.isLocked ? 'disabled' : ''} placeholder="اكتب الرقم هنا (مثال: 50)" class="w-full text-xs font-bold bg-white border border-rose-200 rounded-xl p-2 outline-none focus:border-rose-500">
                                <button type="button" ${order.isLocked ? 'disabled' : ''} onclick="saveReturnAmount(${index})" class="bg-rose-600 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-rose-700 whitespace-nowrap">تأكيد الرقم</button>
                            </div>
                        </div>
                    </div>

                    <!-- أزرار التواصل -->
                    <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                        <a href="tel:${order.phone}" class="flex-1 bg-emerald-50 text-emerald-700 text-center py-2.5 rounded-xl font-bold text-xs hover:bg-emerald-100 transition"><i class="fa-solid fa-phone ml-1"></i> اتصال</a>
                        <a href="https://wa.me/2${order.phone}?text=${encodedWa}" target="_blank" class="flex-1 bg-green-50 text-green-700 text-center py-2.5 rounded-xl font-bold text-xs hover:bg-green-100 transition"><i class="fa-brands fa-whatsapp ml-1"></i> واتساب</a>
                        <a href="sms:${order.phone}?body=${encodedWa}" class="flex-1 bg-sky-50 text-sky-700 text-center py-2.5 rounded-xl font-bold text-xs hover:bg-sky-100 transition"><i class="fa-solid fa-message ml-1"></i> SMS</a>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("totalOrders").innerText = ordersData.length;
            document.getElementById("totalCollection").innerText = totalCol + " ج.م";
            document.getElementById("totalCommission").innerText = (deliveredCount * commissionRate) + " ج.م";
        }

        // تعديل العنوان محلياً فقط دون إرساله للشيت
        function saveLocalAddress(index) {
            const newAddr = document.getElementById(`addr_${index}`).value;
            ordersData[index].address = newAddr;
            alert("✅ تم تحديث العنوان محلياً في التطبيق بنجاح!");
        }

        // عند تغيير القائمة المنسدلة للحالة
        function onStatusSelectChange(index) {
            const val = document.getElementById(`statusSelect_${index}`).value;
            const returnBox = document.getElementById(`returnBox_${index}`);

            if (val === "مرتجع") {
                returnBox.classList.remove("hidden");
                ordersData[index].statusK = "مرتجع";
                updateOrderData(index, "مرتجع");
            } else {
                returnBox.classList.add("hidden");
                ordersData[index].statusK = val;
                updateOrderData(index, val);
            }
        }

        // حفظ الرقم المكتوب في حالة المرتجع في العمود K
        function saveReturnAmount(index) {
            const amount = document.getElementById(`returnPrice_${index}`).value.trim();
            const valToSave = amount !== "" ? amount : "مرتجع";
            ordersData[index].statusK = valToSave;
            updateOrderData(index, valToSave);
            alert("✅ تم تسجيل قيمة المرتجع (" + valToSave + ") في عمود K بنجاح!");
        }

        // إرسال التحديثات للسيرفر وجوجل شيت لحظياً
        function updateOrderData(index, overrideStatusK = null) {
            const order = ordersData[index];
            const statusK = overrideStatusK !== null ? overrideStatusK : order.statusK;
            const lineN = document.getElementById(`lineN_${index}`).value;
            const selectedMonth = document.getElementById("appMonth").value;

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    month: selectedMonth,
                    rowIndex: order.rowIndex,
                    statusK: statusK,
                    lineN: lineN
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status !== "success") {
                    alert(data.message || "فشل التحديث");
                    fetchOrders(); // إعادة تحميل البيانات الأصلية في حال الرفض
                } else {
                    renderOrders();
                }
            })
            .catch(err => console.log(err));
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
