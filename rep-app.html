<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="تطبيق المناديب" />
  <title>تطبيق المناديب - AMIAI EXPRESS</title>

  <script>
    (function enforceFreshBuild() {
      const BUILD_TAG = "v3.6-20261203";
      const LOGO_FILE = "./1726248526371.jpeg";
      const url = new URL(window.location.href);
      const currentBuild = url.searchParams.get("_b");

      if (currentBuild !== BUILD_TAG) {
        url.searchParams.set("_b", BUILD_TAG);
        window.location.replace(url.toString());
      }

      window.__REP_APP_CONFIG__ = {
        buildTag: BUILD_TAG,
        logoFile: LOGO_FILE
      };
    })();
  </script>

  <style>
    :root {
      --bg: #070d19;
      --panel: #0f172a;
      --card: #111c33;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #060b14 0%, #0b1120 50%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: rgba(17, 28, 51, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      margin-bottom: 14px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: #0f172a;
    }

    .brand-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: #09101f;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.18s ease;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #001324;
      width: 100%;
    }

    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #001f0c;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.14);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: rgba(9, 16, 31, 0.85);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      margin-top: 4px;
      color: var(--accent);
    }

    .order-card {
      background: rgba(9, 16, 31, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .order-card.locked {
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(69, 10, 10, 0.22);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .order-title {
      font-weight: 800;
      font-size: 15px;
      color: #fff;
    }

    .lock-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .status-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 6px 12px;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .msg {
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    .msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      color: #fecaca;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .msg.success {
      display: block;
      background: rgba(34, 197, 94, 0.16);
      color: #bbf7d0;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- الهيدر العام -->
    <div class="card">
      <div class="brand-header">
        <div class="brand-left">
          <img id="appLogo" src="./1726248526371.jpeg" alt="AMIAl EXPRESS" class="brand-logo" onerror="this.style.display='none'" />
          <div>
            <h1 class="brand-title">تطبيق المناديب - AMIAl EXPRESS</h1>
            <p class="brand-sub">إدارة التسليمات والمرتجعات والتحصيل اليومي</p>
          </div>
        </div>
        <span class="badge" id="buildBadge">v3.6-20261203</span>
      </div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div class="card" id="loginCard">
      <h2 style="margin:0 0 12px; font-size:16px; color:var(--accent);">تسجيل دخول المندوب</h2>

      <div class="form-group">
        <label for="sheetSelect">اسم الشيت / الشهر</label>
        <select id="sheetSelect">
          <option value="1/12/2026">1/12/2026</option>
          <option value="1/11/2026">1/11/2026</option>
          <option value="1/10/2026">1/10/2026</option>
        </select>
      </div>

      <div class="form-group">
        <label for="repNameInput">اسم المندوب</label>
        <input type="text" id="repNameInput" placeholder="أدخل اسم المندوب كما هو مسجل" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="pinInput">الكود السري (PIN)</label>
        <input type="password" id="pinInput" placeholder="أدخل الكود السري" autocomplete="current-password" />
      </div>

      <button type="button" class="btn btn-primary" id="loginBtn" onclick="loginAndLoadOrders()">
        دخول وعرض الأوردرات
      </button>

      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- شاشة الأوردرات بعد الدخول -->
    <div id="ordersScreen" class="hidden">
      <div class="card">
        <div class="top-bar">
          <div>
            <div style="font-weight:800; font-size:16px;" id="activeRepTitle">المندوب: -</div>
            <div style="font-size:12px; color:var(--muted);" id="activeSheetTitle">الشيت: -</div>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn-secondary" onclick="refreshOrders()">تحديث 🔄</button>
            <button type="button" class="btn btn-danger" onclick="logoutRep()">خروج</button>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">إجمالي الأوردرات</div>
            <div class="stat-val" id="statTotalOrders">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">تم التسليم</div>
            <div class="stat-val" id="statDeliveredOrders" style="color:var(--accent2)">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">تحت التسليم</div>
            <div class="stat-val" id="statPendingOrders" style="color:var(--warn)">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">إجمالي الوارد (K)</div>
            <div class="stat-val" id="statTotalCollected">0</div>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم، رقم الهاتف، العنوان، المحافظة، الراسل، أو الملاحظات..." oninput="renderFilteredOrders()" />
        </div>

        <div id="globalMsg" class="msg"></div>
      </div>

      <div id="ordersList"></div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwEnunQZiWmXe7wUj8MRZb0kJSRL2QZ3QYjq7V1dIlN4-wxZ5DDbIafpg9MVAlaudHebA/exec";
    const LOCK_KEYWORDS = ["شبراوى", "وراقى", "محمد", "محمود"];
    const LOCATION_CONSENT_KEY = "amial_rep_location_consent_v1"; // "granted" | "denied"

    let currentSession = {
      sheetName: "",
      repName: "",
      pin: "",
      defaultCommission: 25
    };
    let allOrders = [];

    function normalizeArabic(str) {
      return String(str || "")
        .trim()
        .replace(/\s+/g, " ")
        .replace(/[أإآ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        .toLowerCase();
    }

    function isLockedStatus(val) {
      const norm = normalizeArabic(val);
      if (!norm) return false;
      return LOCK_KEYWORDS.some(k => {
        const nk = normalizeArabic(k);
        return nk && norm.includes(nk);
      });
    }

    function showBoxMessage(elId, text, type) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.className = "msg " + (type || "error");
      el.textContent = text;
    }

    function hideBoxMessage(elId) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.className = "msg";
      el.textContent = "";
    }

    // طلب موافقة اللوكيشن مرة واحدة فقط وتخزين القرار في localStorage
    function requestLocationConsentOnce(repName, pin, webAppUrl) {
      const safeRep = String(repName || "").trim();
      const safePin = String(pin || "").trim();
      const apiUrl = String(webAppUrl || WEB_APP_URL || "").trim();

      if (!safeRep || !safePin || !apiUrl) return;

      const savedDecision = localStorage.getItem(LOCATION_CONSENT_KEY);

      if (savedDecision === "granted") {
        sendRepCurrentLocation(safeRep, safePin, apiUrl, false);
        return;
      }

      if (savedDecision === "denied") {
        sendConsentStatusOnly(safeRep, safePin, apiUrl, "denied");
        return;
      }

      const isAgreed = confirm(
        "موافقة تُطلب مرة واحدة فقط:\nهل توافق على مشاركة موقعك الحالي وتحديثه مع الإدارة أثناء استخدام التطبيق؟"
      );

      if (isAgreed) {
        localStorage.setItem(LOCATION_CONSENT_KEY, "granted");
        sendRepCurrentLocation(safeRep, safePin, apiUrl, true);
      } else {
        localStorage.setItem(LOCATION_CONSENT_KEY, "denied");
        sendConsentStatusOnly(safeRep, safePin, apiUrl, "denied");
      }
    }

    function sendConsentStatusOnly(repName, pin, apiUrl, consentStatus) {
      const url = `${apiUrl}?action=updateRepLocation&repName=${encodeURIComponent(repName)}&pin=${encodeURIComponent(pin)}&consentStatus=${encodeURIComponent(consentStatus)}&_t=${Date.now()}`;
      fetch(url, { cache: "no-store" }).catch(() => {});
    }

    function sendRepCurrentLocation(repName, pin, apiUrl, notifyOnFail) {
      if (!navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = Math.round(pos.coords.accuracy || 0);
          const url = `${apiUrl}?action=updateRepLocation&repName=${encodeURIComponent(repName)}&pin=${encodeURIComponent(pin)}&consentStatus=granted&lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}&accuracy=${encodeURIComponent(accuracy)}&_t=${Date.now()}`;
          fetch(url, { cache: "no-store" }).catch(() => {});
        },
        () => {
          if (notifyOnFail) {
            alert("تعذر قراءة الموقع من الجهاز. تأكد من تفعيل GPS ومنح المتصفح صلاحية الموقع.");
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }

    async function loginAndLoadOrders() {
      hideBoxMessage("loginMsg");

      const sheetName = document.getElementById("sheetSelect").value.trim();
      const repName = document.getElementById("repNameInput").value.trim();
      const pin = document.getElementById("pinInput").value.trim();

      if (!sheetName || !repName || !pin) {
        showBoxMessage("loginMsg", "يرجى إدخال اسم الشيت واسم المندوب والكود السري.", "error");
        return;
      }

      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "جاري التحقق...";

      try {
        const url = `${WEB_APP_URL}?action=loginAndGetOrders&sheetName=${encodeURIComponent(sheetName)}&repName=${encodeURIComponent(repName)}&pin=${encodeURIComponent(pin)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();

        if (!data || data.status !== "success") {
          showBoxMessage("loginMsg", (data && data.message) || "تعذر تسجيل الدخول.", "error");
          return;
        }

        currentSession = {
          sheetName,
          repName,
          pin,
          defaultCommission: data.defaultCommission || 25
        };
        allOrders = Array.isArray(data.orders) ? data.orders : [];

        document.getElementById("loginCard").classList.add("hidden");
        document.getElementById("ordersScreen").classList.remove("hidden");
        document.getElementById("activeRepTitle").textContent = "المندوب: " + currentSession.repName;
        document.getElementById("activeSheetTitle").textContent = "الشيت: " + currentSession.sheetName;

        updateStats();
        renderFilteredOrders();

        // أخذ الموافقة مرة واحدة فقط بعد نجاح الدخول
        setTimeout(() => {
          requestLocationConsentOnce(currentSession.repName, currentSession.pin, WEB_APP_URL);
        }, 300);
      } catch (err) {
        showBoxMessage("loginMsg", "حدث خطأ أثناء الاتصال بالسيرفر.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "دخول وعرض الأوردرات";
      }
    }

    async function refreshOrders() {
      if (!currentSession.sheetName || !currentSession.repName || !currentSession.pin) return;
      hideBoxMessage("globalMsg");

      try {
        const url = `${WEB_APP_URL}?action=loginAndGetOrders&sheetName=${encodeURIComponent(currentSession.sheetName)}&repName=${encodeURIComponent(currentSession.repName)}&pin=${encodeURIComponent(currentSession.pin)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();

        if (data && data.status === "success") {
          allOrders = Array.isArray(data.orders) ? data.orders : [];
          updateStats();
          renderFilteredOrders();
          showBoxMessage("globalMsg", "تم تحديث قائمة الأوردرات بنجاح.", "success");
        }
      } catch (err) {
        showBoxMessage("globalMsg", "تعذر تحديث الأوردرات.", "error");
      }
    }

    function logoutRep() {
      currentSession = { sheetName: "", repName: "", pin: "", defaultCommission: 25 };
      allOrders = [];
      document.getElementById("pinInput").value = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("ordersScreen").classList.add("hidden");
      document.getElementById("loginCard").classList.remove("hidden");
      hideBoxMessage("loginMsg");
      hideBoxMessage("globalMsg");
    }

    function updateStats() {
      const total = allOrders.length;
      let delivered = 0;
      let pending = 0;
      let collectedSum = 0;

      allOrders.forEach(o => {
        const st = String(o.confirmL || "").trim();
        const kVal = parseFloat(o.collectedK) || 0;
        if (st === "تم التسليم") delivered++;
        if (st === "تحت التسليم") pending++;
        collectedSum += kVal;
      });

      document.getElementById("statTotalOrders").textContent = total;
      document.getElementById("statDeliveredOrders").textContent = delivered;
      document.getElementById("statPendingOrders").textContent = pending;
      document.getElementById("statTotalCollected").textContent = collectedSum.toLocaleString();
    }

    function onStatusChange(rowIndex) {
      const statusSel = document.getElementById(`status_${rowIndex}`);
      const priceInp = document.getElementById(`price_${rowIndex}`);
      if (!statusSel || !priceInp) return;

      // عند اختيار "تحت التسليم" يتم تصفير حقل الوارد K في الواجهة ومسحه في الشيت عند الحفظ
      if (statusSel.value === "تحت التسليم") {
        priceInp.value = "0";
      }
    }

    function renderFilteredOrders() {
      const q = normalizeArabic(document.getElementById("searchInput").value || "");
      const listEl = document.getElementById("ordersList");

      const filtered = !q ? allOrders : allOrders.filter(o => {
        const hay = normalizeArabic([
          o.clientName,
          o.phone,
          o.address,
          o.governorate,
          o.sender,
          o.confirmL,
          o.notesN,
          o.price,
          o.collectedK
        ].join(" "));
        return hay.includes(q);
      });

      if (!filtered.length) {
        listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">لا توجد أوردرات مطابقة.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(o => {
        const locked = Boolean(o.isLocked) || isLockedStatus(o.confirmL);
        const currentStatus = String(o.confirmL || "").trim();
        const kValue = currentStatus === "تحت التسليم" ? 0 : (parseFloat(o.collectedK) || 0);

        return `
          <div class="order-card ${locked ? "locked" : ""}">
            <div class="order-top">
              <div class="order-title">${o.clientName || "بدون اسم"} — <span style="color:var(--accent)">${o.phone || "-"}</span></div>
              <div>
                ${locked
                  ? `<span class="lock-pill">🔒 مقفل (${currentStatus})</span>`
                  : `<span class="status-pill">${currentStatus || "غير محدد"}</span>`}
              </div>
            </div>

            <div class="meta-grid">
              <div><b>المحافظة:</b> ${o.governorate || "-"}</div>
              <div><b>العنوان:</b> ${o.address || "-"}</div>
              <div><b>الراسل:</b> ${o.sender || "-"}</div>
              <div><b>سعر الأوردر (J):</b> ${Number(o.price || 0).toLocaleString()} ج.م</div>
              <div><b>الوارد الحالي (K):</b> ${Number(o.collectedK || 0).toLocaleString()} ج.م</div>
              <div><b>التاريخ:</b> ${o.date || "-"}</div>
            </div>

            <div class="edit-grid">
              <div>
                <label>الحالة (عمود L)</label>
                <select id="status_${o.rowIndex}" ${locked ? "disabled" : ""} onchange="onStatusChange(${o.rowIndex})">
                  <option value="" ${currentStatus === "" ? "selected" : ""}>-- اختر الحالة --</option>
                  <option value="تحت التسليم" ${currentStatus === "تحت التسليم" ? "selected" : ""}>تحت التسليم</option>
                  <option value="تم التسليم" ${currentStatus === "تم التسليم" ? "selected" : ""}>تم التسليم</option>
                  <option value="جزئي" ${currentStatus === "جزئي" ? "selected" : ""}>جزئي</option>
                  <option value="مرتجع" ${currentStatus === "مرتجع" ? "selected" : ""}>مرتجع</option>
                </select>
              </div>

              <div>
                <label>المبلغ المحصل / الوارد (عمود K)</label>
                <input type="number" step="any" id="price_${o.rowIndex}" value="${kValue}" ${locked ? "disabled" : ""} />
              </div>

              <div>
                <label>ملاحظات (عمود N)</label>
                <input type="text" id="notes_${o.rowIndex}" value="${String(o.notesN || "").replace(/"/g, """)}" ${locked ? "disabled" : ""} placeholder="اكتب ملاحظة..." />
              </div>
            </div>

            <button type="button" class="btn btn-success" style="width:100%;" ${locked ? "disabled" : ""} id="saveBtn_${o.rowIndex}" onclick="saveOrderUpdate(${o.rowIndex})">
              ${locked ? "🔒 الأوردر مقفل ولا يمكن تعديله" : "💾 حفظ التحديث"}
            </button>
          </div>
        `;
      }).join("");
    }

    async function saveOrderUpdate(rowIndex) {
      hideBoxMessage("globalMsg");

      const statusSel = document.getElementById(`status_${rowIndex}`);
      const priceInp = document.getElementById(`price_${rowIndex}`);
      const notesInp = document.getElementById(`notes_${rowIndex}`);
      const saveBtn = document.getElementById(`saveBtn_${rowIndex}`);

      const orderStatus = statusSel ? statusSel.value.trim() : "";
      const rawPrice = orderStatus === "تحت التسليم" ? "0" : (priceInp ? priceInp.value.trim() : "");
      const notes = notesInp ? notesInp.value.trim() : "";

      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "جاري الحفظ...";
      }

      try {
        const url = `${WEB_APP_URL}?action=updateOrderStatus&sheetName=${encodeURIComponent(currentSession.sheetName)}&repName=${encodeURIComponent(currentSession.repName)}&pin=${encodeURIComponent(currentSession.pin)}&rowIndex=${encodeURIComponent(rowIndex)}&orderStatus=${encodeURIComponent(orderStatus)}&price=${encodeURIComponent(rawPrice)}¬es=${encodeURIComponent(notes)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();

        if (!data || data.status !== "success") {
          showBoxMessage("globalMsg", (data && data.message) || "تعذر حفظ التحديث.", "error");
          if (data && data.locked) {
            await refreshOrders();
          }
          return;
        }

        const target = allOrders.find(item => item.rowIndex === rowIndex);
        if (target) {
          target.confirmL = data.savedStatus !== undefined ? data.savedStatus : orderStatus;
          target.collectedK = data.savedPrice !== undefined ? data.savedPrice : (orderStatus === "تحت التسليم" ? 0 : parseFloat(rawPrice) || 0);
          target.notesN = data.savedNotes !== undefined ? data.savedNotes : notes;
          target.isLocked = isLockedStatus(target.confirmL);
        }

        updateStats();
        renderFilteredOrders();
        showBoxMessage("globalMsg", "تم حفظ تحديث الأوردر بنجاح.", "success");
      } catch (err) {
        showBoxMessage("globalMsg", "حدث خطأ أثناء إرسال التحديث.", "error");
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = "💾 حفظ التحديث";
        }
      }
    }
  </script>
</body>
</html>
